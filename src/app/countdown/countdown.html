<div class="page" [class.shake]="shake">
  <!-- Background image + overlays -->
  <div class="bg" aria-hidden="true">
    <!-- animated fog over everything -->
    <div class="fog fog-back"></div>
    <div class="fog fog-front"></div>

    <!-- lightning both sides -->
    <div
      class="lightning lightning-left"
      [class.active]="lightningLeft"
      [class.red]="lightningLeftColor === 'red'"
      [class.green]="lightningLeftColor === 'green'">
    </div>

    <div
      class="lightning lightning-right"
      [class.active]="lightningRight"
      [class.red]="lightningRightColor === 'red'"
      [class.green]="lightningRightColor === 'green'">
    </div>

    <!-- grain + vignette -->
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <!-- Foreground -->
  <div class="content">
    <div class="title glitch-name">
  GET READY {{ currentName }}
</div>
    <div class="line"></div>

    <div class="countdown" [class.glitch]="glitch">
      <span class="time">{{ days }}d</span>
      <span class="sep">:</span>
      <span class="time">{{ hours }}h</span>
      <span class="sep">:</span>
      <span class="time">{{ minutes }}m</span>
      <span class="sep">:</span>
      <span class="time">{{ seconds }}s</span>
    </div>

    <div class="line"></div>

    <div class="subtitle">COME BACK SOON</div>

    <div class="meta">
      <div class="location">Casa Ștefan – Gura Humorului</div>
      <div class="date creepy-fade">27 feb – 01 mar</div>
    </div>
  </div>
</div>
