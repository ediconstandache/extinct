<div class="page">
  <!-- Background -->
<div class="bg" aria-hidden="true">
  <div class="sky"></div>

  <div class="ruins ruins-left"></div>
  <div class="ruins ruins-right"></div>

  <!-- fog should sit over ruins -->
  <div class="fog fog-back"></div>
  <div class="fog fog-front"></div>

  <div class="lightning lightning-left" [class.active]="lightningLeft"></div>
  <div class="lightning lightning-right" [class.active]="lightningRight"></div>

  <div class="grain"></div>
  <div class="vignette"></div>
</div>


  <!-- Foreground text (no box) -->
  <div class="content">
    <div class="title">WORK IN PROGRESS</div>
    <div class="line"></div>

    <div class="countdown" [class.glitch]="glitch">
      <span class="time days">{{ days }}d</span>
      <span class="sep">:</span>
      <span class="time hours">{{ hours | number: '2.0-0' }}h</span>
      <span class="sep">:</span>
      <span class="time mins">{{ minutes | number: '2.0-0' }}m</span>
      <span class="sep">:</span>
      <span class="time secs">{{ seconds | number: '2.0-0' }}s</span>
    </div>

    <div class="line"></div>

    <div class="subtitle">COME BACK SOON</div>

    <div class="meta">
      <div class="location">Casa Ștefan – Gura Humorului</div>
      <div class="date creepy-fade">27 feb – 01 mar</div>
    </div>
  </div>
</div>
